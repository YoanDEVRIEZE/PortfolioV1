services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: portfoliov1
      MYSQL_USER: portfolio_app
      MYSQL_PASSWORD: portfolio_dev
      MYSQL_ROOT_PASSWORD: portfolio_root_dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=portfolio_app --password=portfolio_dev --silent"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
